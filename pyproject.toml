[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-tts-ita"
version = "0.1.0"
description = "Audio parlato italiano -> trascrizione con timestamp -> TTS (100% open source)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
stt-tts-ita = "stt_tts_ita.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
